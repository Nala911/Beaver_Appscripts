<html>

<body>

    <div class="header">
    <div class="header-title">
      <i data-lucide="file-text" style="width:18px;"></i>
      Forms Sync
    </div>
  </div>

    <div class="container">
        <!-- Connect Section -->
        <div>
            <div class="section-label">
                <i data-lucide="link" style="width:16px;"></i> Connect Form
            </div>
            <div class="card">
                <div class="form-group">
                    <label class="label">Select Recent Form</label>
                    <select id="form-select" class="select" onchange="onFormChange()">
                        <option value="">Loading forms...</option>
                    </select>
                </div>

                <div id="quick-links" style="display: none;">
                    <div class="label" style="margin-top: 10px;">Quick Access</div>
                    <div class="link-grid">
                        <a id="link-edit" href="#" target="_blank" class="link-card">
                            <i data-lucide="edit" style="width:16px;"></i>
                            <span>Edit Form</span>
                        </a>
                        <a id="link-responses" href="#" target="_blank" class="link-card">
                            <i data-lucide="bar-chart-2" style="width:16px;"></i>
                            <span>Responses</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pull Section -->
        <div>
            <div class="section-label">
                <i data-lucide="download" style="width:16px;"></i> Sync Actions
            </div>
            <div class="card">
                <p style="color: var(--text-secondary); margin-bottom: 12px; line-height: 1.4;">
                    Pull form structure into the spreadsheet to edit questions and options.
                </p>
                <button class="btn btn-primary btn-pull" onclick="pullForm()">
                    <i data-lucide="download" style="width:16px;"></i> Pull from Form
                </button>
            </div>
        </div>

        <!-- Push Section -->
        <div>
            <div class="section-label">
                <i data-lucide="upload" style="width:16px;"></i> Sync Actions
            </div>
            <div class="card">
                <p style="color: var(--text-secondary); margin-bottom: 12px; line-height: 1.4;">
                    Apply changes made in the spreadsheet back to the Google Form.
                </p>
                <button class="btn btn-success btn-push" onclick="syncToForm()">
                    <i data-lucide="upload" style="width:16px;"></i> Sync to Form
                </button>
            </div>
        </div>
    </div>

    <?!= _App_include('SidebarShared'); ?>

    <script>
        // --- INITIALIZATION ---
        window.onload = function () {
            SyncSidebar.initSidebar({
                createIcons: false,
                onLoad: loadForms
            });
        };

        function loadForms() {
            SyncSidebar.run('FormsSync_getForms', [], {
                context: 'Load Forms',
                onSuccess: function(res) {
                    renderLists(res.data);
                    showQuickLinks();
                }
            });
        }

        function renderLists(data) {
            const select = document.getElementById('form-select');
            select.innerHTML = '<option value="">-- Choose a Form --</option>';

            if (data.forms && data.forms.length > 0) {
                data.forms.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.id;
                    opt.textContent = f.title;
                    if (f.id === data.savedFormId) opt.selected = true;
                    select.appendChild(opt);
                });
            } else {
                select.innerHTML = '<option value="">No recent forms found</option>';
            }
        }

        function onFormChange() {
            showQuickLinks();
        }

        function showQuickLinks() {
            const formId = document.getElementById('form-select').value;
            const container = document.getElementById('quick-links');
            
            if (!formId) {
                container.style.display = 'none';
                return;
            }

            SyncSidebar.run('FormsSync_getFormLinks', [], {
                context: 'Load Links',
                onSuccess: function(res) {
                    const links = res.data;
                    if (links && links.editUrl) {
                        document.getElementById('link-edit').href = links.editUrl;
                        document.getElementById('link-responses').href = links.responsesUrl;
                        container.style.display = 'block';
                    } else {
                        container.style.display = 'none';
                    }
                }
            });
        }

        function pullForm() {
            const formId = document.getElementById('form-select').value;
            if (!formId) {
                SyncSidebar.showToast('Please select a form first.', true);
                return;
            }

            SyncSidebar.runPullAction({
                action: {
                    method: 'FormsSync_pullForm',
                    args: [formId],
                    context: 'Pull Form',
                    loadingText: 'Pulling form...'
                }
            });
        }

        function syncToForm() {
            SyncSidebar.runPushAction({
                action: {
                    method: 'FormsSync_syncToForm',
                    context: 'Sync to Form',
                    loadingText: 'Syncing to form...'
                }
            });
        }
    </script>
</body>

</html>
