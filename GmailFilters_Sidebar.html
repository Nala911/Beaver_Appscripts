<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    </head>

<body>

    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <i data-lucide="filter" style="width:18px;"></i>
            Gmail Filters
        </div>
        <div id="statusBadge" class="status-badge">
            Ready
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">

        <!-- Action Buttons -->
        <div>
            <div class="section-label">
                <i data-lucide="zap" style="width:13px;"></i> Actions
            </div>
            <div class="btn-group">
                <button id="btn-pull" class="btn btn-pull" onclick="runPull()">
                    <i data-lucide="download" style="width:15px;"></i> Pull
                </button>
                <button id="btn-push" class="btn btn-push" onclick="runPush()">
                    <i data-lucide="upload-cloud" style="width:15px;"></i> Push
                </button>
        </div>

        <!-- Help & Guide Container -->
        <div id="sync-sidebar-help-container"></div>
    </div>

    <?!= _App_include('SidebarShared'); ?>

    <script>
        // ── Init ──
        window.onload = function () {
            SyncSidebar.initSidebar({ toolKey: 'GMAIL_FILTERS' });
        };

        function runPull() {
            setStatus('working');
            SyncSidebar.runPullAction({
                unsavedCheckMethod: 'UI_checkForUnsavedChanges',
                unsavedCheckArgs: ['GMAIL_FILTERS'],
                action: {
                    method: 'GmailFilters_pullFilters',
                    context: 'Pull Filters',
                    unwrap: false,
                    loadingText: 'Pulling filters from Gmail...',
                    showSuccessToast: false,
                    onSuccess: function(res) {
                        setStatus(res.success ? 'ready' : 'error');
                        SyncSidebar.showToast(res.message, !res.success);
                    },
                    onError: function(err) {
                        SyncSidebar.handleError(err, { context: 'Pull Filters', resetLoading: true });
                        setStatus('error');
                    }
                }
            });
        }

        function runPush() {
            setStatus('working');
            SyncSidebar.runPushAction({
                checkMethod: 'GmailFilters_getMissingLabels',
                runMethod: 'GmailFilters_processAction',
                confirmOptions: {
                    checkText: 'Checking labels...',
                    runText: 'Pushing changes...',
                    confirmPrefix: 'The following new labels will be created in Gmail:\n\n',
                    runContext: 'Push Actions',
                    onSuccess: function(res) {
                        SyncSidebar.toggleLoading(false);
                        setStatus(res.success ? 'ready' : 'error');
                        SyncSidebar.showToast(res.message, !res.success);
                    },
                    onError: function(err) {
                        SyncSidebar.handleError(err, { context: 'Push Actions', resetLoading: true });
                        setStatus('error');
                    }
                }
            });
        }

        // ── Helpers ──
        function setStatus(state) {
            SyncSidebar.setStatusBadge('statusBadge', state, {
                workingText: 'Working'
            });
        }
    </script>
</body>

</html>
