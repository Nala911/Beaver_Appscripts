<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>

  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <i data-lucide="message-square" style="width:18px;"></i>
      Google Chat Spaces
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">

    <!-- Import Actions -->
    <div>
      <div class="section-label">
        <i data-lucide="download-cloud" style="width:16px;"></i> Import Members
      </div>
      <div class="card">
        <p style="color: var(--text-secondary); margin-bottom: 14px; line-height: 1.5;">
          Fetch all members from every Chat Space you belong to and import them into the sheet.

        <button class="btn btn-primary btn-pull" onclick="runPull()">
          <i data-lucide="download-cloud" style="width:16px;"></i>

      </div>
    </div>

    <!-- Sync Actions -->
    <div>
      <div class="section-label">

      </div>
      <div class="card">
        <button class="btn btn-success btn-push" onclick="runPush()">
          <i data-lucide="upload-cloud" style="width:16px;"></i>
          Push Changes
        </button>
      </div>
    </div>

  <?!= _App_include('SidebarShared'); ?>
  <script>
    // --- INITIALIZATION ---
    window.onload = function () {
      SyncSidebar.initSidebar({});
    };

    function runPull() {
      SyncSidebar.runPullAction({
        unsavedCheckMethod: 'ChatSpaceSync_checkForUnsavedChanges',
        action: {
          method: 'ChatSpaceSync_pullMembers',
          context: 'Pull Members',
          loadingText: 'Importing all members…'
        }
      });
    }

    function runPush() {
      SyncSidebar.runPushAction({
        action: {
          method: 'ChatSpaceSync_pushChanges',
          context: 'Push Changes',
          loadingText: 'Syncing changes…'
        }
      });
    }
  </script>
</body>

</html>
