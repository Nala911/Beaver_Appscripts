<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <i data-lucide="message-square" style="width:18px;"></i>
      Google Chat Spaces
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">

    <!-- Space Selection -->
    <div>
      <div class="section-label">
        <i data-lucide="check-square" style="width:16px;"></i> Target Spaces
      </div>
      <div class="card" style="padding: 10px 14px;">
        <input type="text" id="spaceSearch" placeholder="Search spaces..." style="margin-bottom: 10px;" oninput="filterSpaces()">
        <div id="spacesListContainer" style="max-height: 150px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; display: flex; flex-direction: column; gap: 8px; background: var(--hover-bg);">
          <div style="font-size: 12px; color: var(--text-secondary); text-align: center; padding: 10px;">Loading spaces...</div>
        </div>
      </div>
    </div>

    <!-- Import Actions -->
    <div>
      <div class="section-label">
        <i data-lucide="download-cloud" style="width:16px;"></i> Import Members
      </div>
      <div class="card">
        <p style="color: var(--text-secondary); margin-bottom: 14px; line-height: 1.5;">
          Fetch current members from selected target spaces and import them into the spreadsheet.
        </p>
        <button class="btn btn-primary btn-pull" onclick="runPull()">
          <i data-lucide="download-cloud" style="width:16px;"></i>
          Pull All Members
        </button>
      </div>
    </div>

    <!-- Sync Actions -->
    <div>
      <div class="section-label">
        <i data-lucide="refresh-cw" style="width:16px;"></i> Sync Actions
      </div>
      <div class="card">
        <button class="btn btn-success btn-push" onclick="runPush()">
          <i data-lucide="upload-cloud" style="width:16px;"></i>
          Push Changes
        </button>
      </div>
    </div>

    <!-- Help & Guide Container -->
    <div id="sync-sidebar-help-container"></div>

  </div>

  <?!= _App_include('SidebarShared'); ?>
  <script>
    var allSpaces = [];
    var selectedSpaceIds = [];

    // --- INITIALIZATION ---
    window.onload = function () {
      SyncSidebar.initSidebar({
        toolKey: 'CHAT_SYNC',
        onLoad: function () {
          loadData();
        }
      });
    };

    function loadData() {
      SyncSidebar.run('ChatSpaceSync_getLoadData', [], {
        context: 'Load Data',
        onSuccess: populateUI
      });
    }

    function populateUI(data) {
      if (!data) return;
      allSpaces = data.spaces || [];
      selectedSpaceIds = data.savedSpaceIds || [];
      renderSpaces();
      updatePullButtonLabel();
    }

    function renderSpaces() {
      const container = document.getElementById('spacesListContainer');
      const searchQuery = document.getElementById('spaceSearch').value.toLowerCase().trim();
      
      if (allSpaces.length === 0) {
        container.innerHTML = '<div style="font-size: 12px; color: var(--text-secondary); text-align: center; padding: 10px;">No spaces found.</div>';
        return;
      }

      var filtered = allSpaces.filter(function(s) {
        return s.name.toLowerCase().indexOf(searchQuery) !== -1;
      });
      
      if (filtered.length === 0) {
        container.innerHTML = '<div style="font-size: 12px; color: var(--text-secondary); text-align: center; padding: 10px;">No matching spaces.</div>';
        return;
      }

      container.innerHTML = filtered.map(function(s) {
        const isChecked = selectedSpaceIds.indexOf(s.id) !== -1 ? 'checked' : '';
        return `
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; user-select: none;">
            <input type="checkbox" value="${s.id}" ${isChecked} onchange="toggleSpace(this)" style="cursor: pointer; width: 14px; height: 14px;">
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${s.name}</span>
          </label>
        `;
      }).join('');
    }

    function filterSpaces() {
      renderSpaces();
    }

    function toggleSpace(checkbox) {
      const spaceId = checkbox.value;
      if (checkbox.checked) {
        if (selectedSpaceIds.indexOf(spaceId) === -1) selectedSpaceIds.push(spaceId);
      } else {
        selectedSpaceIds = selectedSpaceIds.filter(function(id) { return id !== spaceId; });
      }
      
      // Save preferences silently in background
      SyncSidebar.run('ChatSpaceSync_savePreferences', [selectedSpaceIds], {
        context: 'Save Preferences',
        lockButtons: false,
        toast: false
      });
      
      updatePullButtonLabel();
    }

    function updatePullButtonLabel() {
      const pullBtn = document.querySelector('.btn-pull');
      if (pullBtn) {
        if (selectedSpaceIds.length > 0) {
          pullBtn.innerHTML = `<i data-lucide="download-cloud" style="width:16px;"></i> Pull Selected (${selectedSpaceIds.length})`;
        } else {
          pullBtn.innerHTML = `<i data-lucide="download-cloud" style="width:16px;"></i> Pull All Members`;
        }
        SyncSidebar.refreshIcons();
      }
    }

    function runPull() {
      SyncSidebar.runPullAction({
        unsavedCheckMethod: 'UI_checkForUnsavedChanges',
        unsavedCheckArgs: ['CHAT_SYNC'],
        action: {
          method: 'ChatSpaceSync_pullMembers',
          context: 'Pull Members',
          loadingText: selectedSpaceIds.length > 0 ? 'Importing members...' : 'Importing all members…'
        }
      });
    }

    function runPush() {
      SyncSidebar.runPushAction({
        action: {
          method: 'ChatSpaceSync_pushChanges',
          context: 'Push Changes',
          loadingText: 'Syncing changes…'
        }
      });
    }
  </script>
</body>

</html>
