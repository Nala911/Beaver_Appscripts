<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <title>Google Contacts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    </head>

<body>

    <!-- Header -->
    <div class="header">
    <div class="header-title">
      <i data-lucide="users" style="width:18px;"></i>
      Google Contacts
    </div>
  </div>

    <!-- Main Content -->
    <div class="container">

        <!-- Sync Actions -->
        <div>
            <div class="section-label">
                <i data-lucide="refresh-cw" style="width:16px;"></i> Sync Actions
            </div>
            <div class="card sync-sidebar-action-grid">
                <button class="btn btn-primary btn-pull" onclick="pullData()" style="flex:1;">
                    <i data-lucide="download-cloud" style="width:16px;"></i> Pull
                </button>
                <button class="btn btn-success btn-push" onclick="pushData()" style="flex:1;">
                    <i data-lucide="upload-cloud" style="width:16px;"></i> Push
                </button>
            </div>
        </div>

    </div>

    <?!= _App_include('SidebarShared'); ?>
    <script>
        // --- INITIALIZATION ---
        window.onload = function () {
            SyncSidebar.initSidebar({});
        };

        // --- PULL LOGIC ---

        function pullData() {
            SyncSidebar.runPullAction({
                unsavedCheckMethod: 'ContactsSync_checkForUnsavedChanges',
                unsavedContext: 'Check Unsaved',
                action: {
                    method: 'ContactsSync_pullContacts',
                    args: [{ groupIds: ['all'] }],
                    context: 'Pull Contacts',
                    loadingText: 'Pulling contacts…'
                }
            });
        }

        // --- PUSH LOGIC ---

        function pushData() {
            SyncSidebar.runPushAction({
                checkMethod: 'ContactsSync_getMissingGroups',
                runMethod: 'ContactsSync_pushChanges',
                confirmOptions: {
                    checkText: 'Checking groups...',
                    runText: 'Pushing changes...',
                    confirmPrefix: 'The following new contact groups will be created:\n\n',
                    runContext: 'Push Changes',
                    onSuccess: function (res) {
                        SyncSidebar.showToast(res.message);
                    }
                }
            });
        }
    </script>
</body>

</html>
