<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <title>Google Contacts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        /* ── Design Tokens ── */
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-bg: #eef2ff;
            --surface: #ffffff;
            --background: #f5f3ff;
            --border: #e2e0f5;
            --border-light: #f0eef9;
            --text: #1e1b4b;
            --text-secondary: #6b7280;
            --success: #10b981;
            --success-dark: #059669;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --gradient-pull: linear-gradient(135deg, #6366f1, #8b5cf6);
            --gradient-push: linear-gradient(135deg, #10b981, #14b8a6);
            --gradient-header: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
            --shadow-sm: 0 1px 3px rgba(99, 102, 241, 0.08);
            --shadow-md: 0 4px 12px rgba(99, 102, 241, 0.10);
            --shadow-lg: 0 8px 24px rgba(99, 102, 241, 0.14);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ── */
        .header {
            background: var(--surface);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-header);
            border-radius: 0 0 2px 2px;
        }

        .header .material-icons-outlined {
            font-size: 22px;
            background: var(--gradient-pull);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        /* ── Main Container ── */
        .container {
            flex: 1;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            min-height: 0;
        }

        .container::-webkit-scrollbar {
            width: 5px;
        }

        .container::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.2);
            border-radius: 10px;
        }

        /* ── Section Labels ── */
        .section-label {
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-label .material-icons-outlined {
            font-size: 15px;
            color: var(--primary-light);
        }

        /* ── Cards ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 14px;
            transition: box-shadow 0.25s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ── Buttons ── */
        .btn {
            width: 100%;
            padding: 0;
            height: 40px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.01em;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            background: rgba(255, 255, 255, 0.15);
            transition: opacity 0.2s ease;
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn-primary {
            background: var(--gradient-pull);
            color: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 1px 4px rgba(99, 102, 241, 0.3);
        }

        .btn-success {
            background: var(--gradient-push);
            color: white;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
        }

        .btn-success:active {
            transform: translateY(0);
            box-shadow: 0 1px 4px rgba(16, 185, 129, 0.3);
        }

        .btn .material-icons-outlined {
            font-size: 17px;
        }

        /* ── Empty State ── */
        .empty-state {
            padding: 30px 15px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <span class="material-icons-outlined">contacts</span>
        <div class="header-title">Google Contacts</div>
    </div>

    <!-- Main Content -->
    <div class="container">

        <!-- Sync Actions -->
        <div>
            <div class="section-label">
                <span class="material-icons-outlined">sync</span> Sync Actions
            </div>
            <div class="card" style="display:flex; gap:10px;">
                <button class="btn btn-primary" onclick="pullData()" style="flex:1;">
                    <span class="material-icons-outlined">cloud_download</span> Pull
                </button>
                <button class="btn btn-success" onclick="pushData()" style="flex:1;">
                    <span class="material-icons-outlined">cloud_upload</span> Push
                </button>
            </div>
        </div>

    </div>

    <?!= _App_include('SidebarShared'); ?>
    <script>
        // --- INITIALIZATION ---
        window.onload = function () {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            
            // Check for unsaved changes (Action column has data)
            SyncSidebar.run('ContactsSync_checkForUnsavedChanges', [], {
                context: 'Check Unsaved',
                onSuccess: function (res) {
                    if (res.data === true) {
                        SyncSidebar.showToast('Unsaved changes detected. Push to sync.', false);
                    }
                }
            });
        };

        // --- PULL LOGIC ---

        function pullData() {
            SyncSidebar.toggleLoading(true, 'Pulling contacts…');
            SyncSidebar.run('ContactsSync_pullContacts', [{ groupIds: ['all'] }], {
                context: 'Pull Contacts',
                onSuccess: function (res) {
                    SyncSidebar.toggleLoading(false);
                    SyncSidebar.showToast(res.message);
                },
                onError: function () { 
                    SyncSidebar.toggleLoading(false); 
                }
            });
        }

        // --- PUSH LOGIC ---

        function pushData() {
            SyncSidebar.confirmAndRun('ContactsSync_getMissingGroups', [], 'ContactsSync_pushChanges', [], {
                checkText: 'Checking groups...',
                runText: 'Pushing changes...',
                confirmPrefix: 'The following new contact groups will be created:\n\n',
                runContext: 'Push Changes',
                onSuccess: function (res) {
                    SyncSidebar.showToast(res.message);
                }
            });
        }
    </script>
</body>

</html>
