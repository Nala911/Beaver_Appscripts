<style>
  /* ── Design Tokens ── */
  :root {
    --primary: #6366f1;
    --primary-light: #818cf8;
    --primary-bg: #eef2ff;
    --surface: #ffffff;
    --background: #f5f3ff;
    --border: #e2e0f5;
    --border-light: #f0eef9;
    --text: #1e1b4b;
    --text-secondary: #6b7280;
    --success: #10b981;
    --success-dark: #059669;
    --success-bg: #ecfdf5;
    --warning: #f59e0b;
    --warning-bg: #fffbeb;
    --danger: #ef4444;
    --danger-bg: #fef2f2;
    --hover-bg: #f5f3ff;
    --gradient-pull: linear-gradient(135deg, #6366f1, #8b5cf6);
    --gradient-push: linear-gradient(135deg, #10b981, #14b8a6);
    --gradient-header: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
    --shadow-sm: 0 1px 3px rgba(99, 102, 241, 0.08);
    --shadow-md: 0 4px 12px rgba(99, 102, 241, 0.10);
    --shadow-lg: 0 8px 24px rgba(99, 102, 241, 0.14);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--background);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  .btn:disabled, button:disabled {
    opacity: 0.6 !important;
    pointer-events: none !important;
    cursor: not-allowed !important;
    box-shadow: none !important;
    transform: none !important;
    filter: grayscale(0.4);
  }

  /* ── Unified Toast ── */
  .sync-sidebar-toast {
    min-width: 250px;
    background: #1f2937;
    color: #fff;
    text-align: center;
    border-radius: 8px;
    padding: 12px 20px;
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 500;
    z-index: 10001;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    opacity: 0;
    transition: opacity 0.3s, bottom 0.3s;
  }
  .sync-sidebar-toast.show {
    visibility: visible;
    opacity: 1;
    bottom: 40px;
  }
  .sync-sidebar-toast.error-toast { background: #dc2626; }
  .sync-sidebar-toast.success-toast { background: #059669; }
  .sync-sidebar-toast.warning-toast { background: #d97706; }
  .sync-sidebar-toast.info-toast { background: #2563eb; }

  /* ── Unified Loading Overlay ── */
  .sync-sidebar-loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(4px);
    z-index: 10000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 15px;
    font-family: sans-serif;
  }
  .sync-sidebar-spinner {
    border: 3px solid #f3f4f6;
    border-top: 3px solid #6366f1;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    animation: spin-shared 0.8s linear infinite;
  }
  @keyframes spin-shared { to { transform: rotate(360deg); } }
  .sync-sidebar-loading-text {
    font-size: 14px;
    font-weight: 600;
    color: #374151;
  }

  /* ── Unified Help Tooltip ── */
  .help-trigger {
    color: #9ca3af;
    cursor: help;
    transition: color 0.2s;
    display: inline-flex;
    align-items: center;
  }
  .help-trigger:hover {
    color: #6366f1;
  }
  #sync-sidebar-tooltip {
    display: none;
    position: fixed;
    background: #ffffff;
    border: 1px solid #6366f1;
    border-top-width: 3px;
    border-radius: 8px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    padding: 12px 16px;
    z-index: 10002;
    max-width: 240px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    line-height: 1.5;
    color: #1e1b4b;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease-out;
  }
  #sync-sidebar-tooltip p { margin-bottom: 8px; }
  #sync-sidebar-tooltip p:last-child { margin-bottom: 0; }
  #sync-sidebar-tooltip strong { color: #6366f1; font-weight: 600; }
  #sync-sidebar-tooltip ul, #sync-sidebar-tooltip ol { padding-left: 18px; margin-top: 4px; }
  #sync-sidebar-tooltip li { margin-bottom: 4px; }

  /* ── Standard Help Guide Card ── */
  .sync-sidebar-help-guide-card {
    background: rgba(99, 102, 241, 0.05);
    border: 1px dashed rgba(99, 102, 241, 0.3) !important;
    padding: 14px;
    border-radius: 12px;
  }
  .sync-sidebar-help-guide-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .sync-sidebar-help-guide-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .sync-sidebar-help-guide-item i {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin-top: 2px;
  }
  .sync-sidebar-help-guide-item div {
    font-size: 12px;
    line-height: 1.5;
    color: #1e1b4b;
  }
  .sync-sidebar-help-guide-item strong {
    color: #1e1b4b;
    font-weight: 600;
  }
  .sync-sidebar-help-guide-item code {
    background: rgba(99, 102, 241, 0.1);
    color: #4f46e5;
    padding: 1px 4px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size: 0.9em;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    position: relative;
    gap: 10px;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--gradient-header);
    border-radius: 0 0 2px 2px;
  }

  .header-title {
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: -0.01em;
  }

  .header-title i, .header-title .material-icons-outlined {
    background: var(--gradient-pull);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .status-badge {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--success-bg);
    color: var(--success);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.3s ease;
    letter-spacing: 0.01em;
  }

  .status-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    display: inline-block;
    flex-shrink: 0;
  }

  .status-badge.working {
    background: var(--warning-bg);
    color: var(--warning);
    animation: pulse-badge 1.5s ease-in-out infinite;
  }

  .status-badge.working::before {
    background: var(--warning);
    animation: pulse-dot 1s ease-in-out infinite;
  }

  .status-badge.error {
    background: var(--danger-bg);
    color: var(--danger);
  }

  .status-badge.error::before {
    background: var(--danger);
  }

  @keyframes pulse-badge {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.6; }
  }

  /* ── Main Container ── */
  .sync-sidebar-page, .container, .main {
    flex: 1;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    min-height: 0;
  }

  .container::-webkit-scrollbar, .main::-webkit-scrollbar {
    width: 5px;
  }

  .container::-webkit-scrollbar-thumb, .main::-webkit-scrollbar-thumb {
    background: rgba(99, 102, 241, 0.2);
    border-radius: 10px;
  }

  /* ── Section Labels ── */
  .sync-sidebar-section-label, .section-label {
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .section-label i, .section-label .material-icons-outlined {
    font-size: 15px;
    color: var(--primary-light);
  }

  /* ── Cards ── */
  .sync-sidebar-card, .card {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 14px;
    transition: box-shadow 0.25s ease;
  }

  .card:hover {
    box-shadow: var(--shadow-md);
  }

  /* ── Buttons ── */
  .sync-sidebar-button-group, .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }

  .sync-sidebar-action-grid {
    display: grid;
    gap: 12px;
  }

  .sync-sidebar-action-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sync-sidebar-inline-options {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 12px;
  }

  .sync-sidebar-button, .btn {
    width: 100%;
    padding: 0 16px;
    height: 40px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    letter-spacing: 0.01em;
  }

  .btn-full {
    grid-column: 1 / -1;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    background: rgba(255, 255, 255, 0.15);
    transition: opacity 0.2s ease;
  }

  .btn:hover::before {
    opacity: 1;
  }

  .btn-primary, .btn-pull {
    background: var(--gradient-pull);
    color: white;
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
  }

  .btn-primary:hover:not(:disabled), .btn-pull:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
  }

  .btn-primary:active:not(:disabled), .btn-pull:active:not(:disabled) {
    transform: translateY(0);
    box-shadow: 0 1px 4px rgba(99, 102, 241, 0.3);
  }

  .btn-success, .btn-push {
    background: var(--gradient-push);
    color: white;
    box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
  }

  .btn-success:hover:not(:disabled), .btn-push:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
  }

  .btn-success:active:not(:disabled), .btn-push:active:not(:disabled) {
    transform: translateY(0);
    box-shadow: 0 1px 4px rgba(16, 185, 129, 0.3);
  }

  .btn-secondary {
    background: var(--primary-bg);
    color: var(--text);
    box-shadow: none;
  }

  .btn-outline {
    background: transparent;
    color: var(--primary);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  
  .btn-outline:hover:not(:disabled) {
    background: var(--hover-bg);
    border-color: var(--primary-light);
  }

  .btn-outline::before {
    display: none;
  }

  .btn i, .btn .material-icons-outlined {
    font-size: 17px;
  }

  /* ── Form Elements ── */
  select, input[type="text"], input[type="password"], input[type="number"], input[type="email"] {
    width: 100%;
    padding: 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background-color: var(--surface);
    color: var(--text);
    outline: none;
    transition: all 0.2s;
  }

  select {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%236b7280%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat;
    background-position: right 12px top 50%;
    background-size: 10px auto;
  }

  select:focus, input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
  }

  /* ── Loaders ── */
  .loader {
    border: 2.5px solid var(--border-light);
    border-top: 2.5px solid var(--primary);
    border-right: 2.5px solid var(--primary-light);
    border-radius: 50%;
    width: 14px;
    height: 14px;
    animation: spin 0.8s ease-in-out infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ── Error & Empty State ── */
  .error-text {
    color: var(--danger);
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    padding: 20px 10px;
  }

  .empty-state {
    padding: 30px 15px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
</style>
<script>
  var SyncSidebar = (function () {
    var DEFAULT_UNSAVED_MESSAGE = "⚠️ WARNING: Unsaved changes detected in the 'Action' column.\n\nRunning 'Pull' will overwrite these changes and they will be LOST.\n\nDo you want to continue?";

    function getMessage(value) {
      if (value && typeof value === 'object' && value.message) return String(value.message);
      return String(value || 'Unknown error');
    }

    function _initUI() {
        if (!document.getElementById('sync-sidebar-loading-overlay')) {
            var overlay = document.createElement('div');
            overlay.id = 'sync-sidebar-loading-overlay';
            overlay.className = 'sync-sidebar-loading-overlay';
            overlay.innerHTML = '<div class="sync-sidebar-spinner"></div><div id="sync-sidebar-loading-text" class="sync-sidebar-loading-text">Processing...</div>' +
                '<div id="sync-sidebar-loading-progress-container" style="display: none; width: 80%; max-width: 240px; margin-top: 5px;">' +
                '  <div style="height: 6px; background: var(--border-light); border-radius: 10px; overflow: hidden; width: 100%;">' +
                '    <div id="sync-sidebar-loading-progress-bar" style="height: 100%; background: var(--gradient-push); width: 0%; transition: width 0.3s ease;"></div>' +
                '  </div>' +
                '  <div id="sync-sidebar-loading-progress-percent" style="font-size: 11px; font-weight: 600; color: var(--text-secondary); text-align: right; margin-top: 4px;">0%</div>' +
                '</div>';
            document.body.appendChild(overlay);
        }
        if (!document.getElementById('sync-sidebar-toast')) {
            var toast = document.createElement('div');
            toast.id = 'sync-sidebar-toast';
            toast.className = 'sync-sidebar-toast';
            document.body.appendChild(toast);
        }
        if (!document.getElementById('sync-sidebar-tooltip')) {
            var tip = document.createElement('div');
            tip.id = 'sync-sidebar-tooltip';
            document.body.appendChild(tip);
        }
        _initHelpSystem();
    }

    var progressIntervals = {};

    function startProgressPolling(toolKey) {
      stopProgressPolling(toolKey);

      var progContainer = document.getElementById('sync-sidebar-loading-progress-container');
      var progBar = document.getElementById('sync-sidebar-loading-progress-bar');
      var progPercent = document.getElementById('sync-sidebar-loading-progress-percent');
      
      if (progContainer) progContainer.style.display = 'block';
      if (progBar) progBar.style.width = '0%';
      if (progPercent) progPercent.innerText = '0%';

      progressIntervals[toolKey] = setInterval(function() {
        run('UI_getProgress', [toolKey], {
          lockButtons: false,
          unwrap: true,
          toast: false,
          onSuccess: function(res) {
            if (res && res.success && res.data) {
              var current = res.data.current;
              var total = res.data.total;
              if (total > 0) {
                var pct = Math.round((current / total) * 100);
                if (progBar) progBar.style.width = pct + '%';
                if (progPercent) progPercent.innerText = pct + '% (' + current + '/' + total + ')';
              }
            }
          },
          onError: function(err) {
            // Silently ignore progress fetch errors to avoid disrupting user experience
          }
        });
      }, 1500);
    }

    function stopProgressPolling(toolKey) {
      if (progressIntervals[toolKey]) {
        clearInterval(progressIntervals[toolKey]);
        delete progressIntervals[toolKey];
      }
      var progContainer = document.getElementById('sync-sidebar-loading-progress-container');
      if (progContainer) {
        progContainer.style.display = 'none';
      }
    }

    function _initHelpSystem() {
      document.body.addEventListener('mouseenter', function(e) {
        var trigger = e.target.closest('.help-trigger');
        if (!trigger) return;
        
        var targetId = trigger.getAttribute('data-help-target');
        var contentSource = document.getElementById(targetId);
        if (!contentSource) return;

        var tooltip = document.getElementById('sync-sidebar-tooltip');
        tooltip.innerHTML = contentSource.innerHTML;
        tooltip.style.display = 'block';
        
        // Position calculation
        var rect = trigger.getBoundingClientRect();
        var tipRect = tooltip.getBoundingClientRect();
        
        var top = rect.bottom + 8;
        var left = rect.left - (tipRect.width / 2) + (rect.width / 2);
        
        // Boundary checks
        if (left < 10) left = 10;
        if (left + tipRect.width > window.innerWidth - 10) {
          left = window.innerWidth - tipRect.width - 10;
        }
        if (top + tipRect.height > window.innerHeight - 10) {
          top = rect.top - tipRect.height - 8;
        }

        tooltip.style.top = top + 'px';
        tooltip.style.left = left + 'px';
        
        // Force reflow for transition
        tooltip.offsetHeight;
        tooltip.style.opacity = '1';
      }, true);

      document.body.addEventListener('mouseleave', function(e) {
        var trigger = e.target.closest('.help-trigger');
        if (!trigger) return;
        
        var tooltip = document.getElementById('sync-sidebar-tooltip');
        tooltip.style.opacity = '0';
        setTimeout(function() {
          if (tooltip.style.opacity === '0') {
            tooltip.style.display = 'none';
          }
        }, 200);
      }, true);
    }

    function _renderHelpGuide(container, helpConfig) {
      if (!helpConfig) return;
      var html = '';
      
      // 1. Render Header/Label
      html += '<div>';
      html += '  <div class="section-label">';
      html += '    <i data-lucide="book-open" style="width:13px;"></i> Help & Guide';
      if (helpConfig.gettingStarted) {
        html += '    <i data-lucide="help-circle" class="help-trigger" data-help-target="help-getting-started" style="width:13px; margin-left: auto;"></i>';
      }
      html += '  </div>';
      
      // 2. Render Card
      html += '  <div class="card sync-sidebar-help-guide-card">';
      html += '    <div class="sync-sidebar-help-guide-list">';
      if (helpConfig.items && helpConfig.items.length > 0) {
        helpConfig.items.forEach(function(item) {
          var colorStyle = item.color ? ' style="color: ' + item.color + ';"' : '';
          html += '      <div class="sync-sidebar-help-guide-item">';
          html += '        <i data-lucide="' + (item.icon || 'help-circle') + '" class="help-trigger" data-help-target="' + (item.tooltipId || '') + '"' + colorStyle + '></i>';
          html += '        <div>';
          html += '          <strong>' + (item.label || '') + ':</strong> ' + (item.shortDesc || '');
          html += '        </div>';
          html += '      </div>';
        });
      }
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      // 3. Render Hidden Tooltips
      html += '<div style="display: none;">';
      if (helpConfig.gettingStarted && helpConfig.gettingStarted.content) {
        html += '  <div id="help-getting-started">' + helpConfig.gettingStarted.content + '</div>';
      }
      if (helpConfig.items && helpConfig.items.length > 0) {
        helpConfig.items.forEach(function(item) {
          if (item.tooltipId && item.tooltipContent) {
            html += '  <div id="' + item.tooltipId + '">' + item.tooltipContent + '</div>';
          }
        });
      }
      html += '</div>';
      
      container.innerHTML = html;
    }

    function installGlobalErrorHandlers() {
      window.onerror = function (msg, url, line, col, error) {
        var detail = 'Error: ' + msg + '\nURL: ' + url + '\nLine: ' + line + ', Col: ' + col + (error ? '\nStack: ' + error.stack : '');
        showCopyableError(detail, 'critical');
        return false;
      };

      window.onunhandledrejection = function (event) {
        showCopyableError(getMessage(event && event.reason), 'critical');
      };
    }

    var activeLocks = 0;

    function toggleButtonLock(lock) {
      if (lock) {
        activeLocks++;
      } else {
        activeLocks = Math.max(0, activeLocks - 1);
      }

      try {
        var btns = document.querySelectorAll('.btn, button');
        if (activeLocks > 0) {
          btns.forEach(function (b) {
            if (!b.disabled) {
              b.disabled = true;
              b.setAttribute('data-locked-by-sync', 'true');
            }
          });
        } else {
          btns.forEach(function (b) {
            if (b.getAttribute('data-locked-by-sync') === 'true') {
              b.disabled = false;
              b.removeAttribute('data-locked-by-sync');
            }
          });
        }
      } catch (e) {
        // Silently fail if button state toggle fails
      }
    }

    function toggleLoading(show, text, options) {
      var opts = options || {};
      var overlay = document.getElementById(opts.overlayId || 'sync-sidebar-loading-overlay');
      var textNode = document.getElementById(opts.textId || 'sync-sidebar-loading-text');

      // Sync button locking with loading state
      toggleButtonLock(show);

      if (overlay) overlay.style.display = (activeLocks > 0) ? 'flex' : 'none';
      if (show && text && textNode) textNode.innerText = text;
      
      if (activeLocks === 0) {
        var progContainer = document.getElementById('sync-sidebar-loading-progress-container');
        if (progContainer) progContainer.style.display = 'none';
      }
    }

    function showToast(message, isError, options) {
      var opts = options || {};
      var node = document.getElementById(opts.toastId || 'sync-sidebar-toast');
      if (!node) return;

      node.innerText = getMessage(message);
      
      var type = opts.type || (isError ? 'error' : 'success');
      node.className = 'sync-sidebar-toast ' + type + '-toast show';
      
      var duration = opts.duration || (isError ? 8000 : 3500);
      setTimeout(function () {
        node.className = node.className.replace('show', '').trim();
      }, duration);
    }

    function resolveTarget(target) {
      if (!target) return null;
      if (typeof target === 'string') return document.getElementById(target);
      return target;
    }

    function setStatusBadge(target, state, options) {
      var opts = options || {};
      var badge = resolveTarget(target);
      if (!badge) return;

      var badgeClass = opts.badgeClass || 'status-badge';
      var readyText = opts.readyText || 'Ready';
      var errorText = opts.errorText || 'Error';
      var workingText = opts.workingText || 'Working...';
      var spinnerHtml = opts.spinnerHtml || '';

      badge.className = badgeClass + ' ' + state;

      if (state === 'working') {
        badge.innerHTML = spinnerHtml ? (spinnerHtml + ' ' + workingText) : workingText;
      } else if (state === 'error') {
        badge.innerText = errorText;
      } else {
        badge.innerText = readyText;
      }
    }

    function extractUnsavedValue(result) {
      if (result === true) return true;
      if (result === false || result == null) return false;
      if (typeof result === 'object') {
        if (result.data === true) return true;
        if (result.data === false) return false;
        if (result.hasChanges === true) return true;
        if (result.hasChanges === false) return false;
      }
      return Boolean(result);
    }

    function confirmIfUnsaved(checkMethod, checkArgs, runFn, options) {
      var opts = options || {};
      run(checkMethod, checkArgs, {
        unwrap: false,
        context: opts.context || 'Check Changes',
        toast: opts.toast,
        severity: opts.severity,
        onSuccess: function (result) {
          if (extractUnsavedValue(result)) {
            showConfirmDialog(
              opts.confirmMessage || "Unsaved changes detected.\n\nContinuing may overwrite them.\n\nDo you want to proceed?",
              function () {
                if (typeof runFn === 'function') runFn(result);
              },
              opts.onCancel,
              {
                title: opts.title || 'Unsaved Changes',
                confirmText: opts.confirmText || 'Proceed',
                cancelText: opts.cancelText || 'Cancel'
              }
            );
          } else if (typeof runFn === 'function') {
            runFn(result);
          }
        },
        onError: opts.onError
      });
    }

    function updateQuotaDisplay(target, amount, options) {
      var opts = options || {};
      var node = resolveTarget(target);
      if (!node) return;

      var text = amount;
      if (text === undefined || text === null || text === '') {
        text = Object.prototype.hasOwnProperty.call(opts, 'emptyText') ? opts.emptyText : '';
      }

      node.innerText = String(text);
      node.classList.remove('loading');

      var threshold = typeof opts.threshold === 'number' ? opts.threshold : 20;
      var numericAmount = Number(amount);
      if (!isNaN(numericAmount) && numericAmount < threshold) {
        node.classList.add('danger');
      } else {
        node.classList.remove('danger');
      }
    }

    function markQuotaError(target, options) {
      var opts = options || {};
      var node = resolveTarget(target);
      if (!node) return;

      node.innerText = opts.errorText || 'Error';
      node.classList.remove('loading');
      node.classList.remove('danger');
    }

    function showCopyableError(msg, severity) {
        var overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = '0'; overlay.style.left = '0';
        overlay.style.width = '100%'; overlay.style.height = '100%';
        overlay.style.backgroundColor = 'rgba(0,0,0,0.5)';
        overlay.style.zIndex = '9999';
        overlay.style.display = 'flex';
        overlay.style.justifyContent = 'center';
        overlay.style.alignItems = 'center';

        var box = document.createElement('div');
        box.style.backgroundColor = '#fff';
        box.style.padding = '20px';
        box.style.borderRadius = '8px';
        box.style.width = '80%';
        box.style.maxWidth = '400px';
        box.style.boxShadow = '0 4px 6px rgba(0,0,0,0.1)';
        box.style.fontFamily = 'sans-serif';

        var title = document.createElement('h3');
        var severityTitle = 'System Error';
        var titleColor = '#dc2626'; // Default critical

        if (severity === 'mild') {
            severityTitle = 'Notice';
            titleColor = '#2563eb'; // Blue
        } else if (severity === 'medium') {
            severityTitle = 'Warning';
            titleColor = '#d97706'; // Amber
        }

        title.innerText = severityTitle;
        title.style.margin = '0 0 10px 0';
        title.style.color = titleColor;

        var textarea = document.createElement('textarea');
        textarea.value = msg;
        textarea.readOnly = true;
        textarea.style.width = '100%';
        textarea.style.height = '100px';
        textarea.style.marginBottom = '15px';
        textarea.style.padding = '8px';
        textarea.style.border = '1px solid #ccc';
        textarea.style.borderRadius = '4px';
        textarea.style.boxSizing = 'border-box';
        textarea.style.resize = 'vertical';

        var btn = document.createElement('button');
        btn.innerText = 'Close';
        btn.style.padding = '8px 16px';
        btn.style.backgroundColor = '#e5e7eb';
        btn.style.color = '#374151';
        btn.style.border = 'none';
        btn.style.borderRadius = '4px';
        btn.style.cursor = 'pointer';
        btn.style.fontWeight = '500';
        btn.onclick = function() { document.body.removeChild(overlay); };

        box.appendChild(title);
        box.appendChild(textarea);
        box.appendChild(btn);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
    }

    function showConfirmDialog(msg, onConfirm, onCancel, options) {
        var opts = options || {};
        var overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = '0'; overlay.style.left = '0';
        overlay.style.width = '100%'; overlay.style.height = '100%';
        overlay.style.backgroundColor = 'rgba(0,0,0,0.5)';
        overlay.style.zIndex = '10000';
        overlay.style.display = 'flex';
        overlay.style.justifyContent = 'center';
        overlay.style.alignItems = 'center';

        var box = document.createElement('div');
        box.style.backgroundColor = '#fff';
        box.style.padding = '24px';
        box.style.borderRadius = '12px';
        box.style.width = '85%';
        box.style.maxWidth = '380px';
        box.style.boxShadow = '0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05)';
        box.style.fontFamily = 'Inter, system-ui, sans-serif';

        var title = document.createElement('h3');
        title.innerText = opts.title || 'Confirm Action';
        title.style.margin = '0 0 12px 0';
        title.style.color = '#111827';
        title.style.fontSize = '18px';
        title.style.fontWeight = '600';

        var body = document.createElement('div');
        body.innerText = msg;
        body.style.marginBottom = '24px';
        body.style.color = '#4b5563';
        body.style.fontSize = '14px';
        body.style.lineHeight = '1.5';
        body.style.whiteSpace = 'pre-wrap';

        var footer = document.createElement('div');
        footer.style.display = 'flex';
        footer.style.justifyContent = 'flex-end';
        footer.style.gap = '12px';

        var cancelBtn = document.createElement('button');
        cancelBtn.innerText = opts.cancelText || 'Cancel';
        cancelBtn.style.padding = '8px 16px';
        cancelBtn.style.backgroundColor = '#f3f4f6';
        cancelBtn.style.color = '#374151';
        cancelBtn.style.border = 'none';
        cancelBtn.style.borderRadius = '6px';
        cancelBtn.style.cursor = 'pointer';
        cancelBtn.style.fontWeight = '500';
        cancelBtn.style.fontSize = '14px';
        cancelBtn.onclick = function() {
            document.body.removeChild(overlay);
            if (typeof onCancel === 'function') onCancel();
        };

        var confirmBtn = document.createElement('button');
        confirmBtn.innerText = opts.confirmText || 'Proceed';
        confirmBtn.style.padding = '8px 16px';
        confirmBtn.style.backgroundColor = '#2563eb';
        confirmBtn.style.color = '#fff';
        confirmBtn.style.border = 'none';
        confirmBtn.style.borderRadius = '6px';
        confirmBtn.style.cursor = 'pointer';
        confirmBtn.style.fontWeight = '500';
        confirmBtn.style.fontSize = '14px';
        confirmBtn.onclick = function() {
            document.body.removeChild(overlay);
            if (typeof onConfirm === 'function') onConfirm();
        };

        footer.appendChild(cancelBtn);
        footer.appendChild(confirmBtn);
        box.appendChild(title);
        box.appendChild(body);
        box.appendChild(footer);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
    }

    function unwrap(result) {
      if (result && typeof result === 'object' && Object.prototype.hasOwnProperty.call(result, 'success')) {
        if (!result.success) {
          throw new Error(result.message || 'Operation failed.');
        }
        if (result.data !== undefined && result.data !== null) {
          if (typeof result.data === 'object' && !Array.isArray(result.data)) {
            var merged = {};
            Object.keys(result.data).forEach(function (key) {
              merged[key] = result.data[key];
            });
            if (merged.message === undefined) merged.message = result.message;
            if (merged.meta === undefined) merged.meta = result.meta;
            if (merged.success === undefined) merged.success = result.success;
            return merged;
          }
          return {
            success: result.success,
            message: result.message,
            data: result.data,
            meta: result.meta
          };
        }
      }
      return result;
    }

    function handleError(err, options) {
      var opts = options || {};
      if (opts.resetLoading !== false) toggleLoading(false, null, opts);
      var msg = getMessage(err);
      if (opts.toast !== false) showToast(msg, true, opts);
      if (typeof opts.onError === 'function') {
        opts.onError(err);
      }
      // Show copyable overlay for easy troubleshooting
      showCopyableError(msg, opts.severity || 'critical');
    }

    function finalizeRun(opts) {
      if (opts && typeof opts.onFinally === 'function') {
        try {
          opts.onFinally();
        } catch (err) {
          showCopyableError(getMessage(err), 'critical');
        }
      }
    }

    function run(methodName, args, options) {
      var opts = options || {};
      var timeoutMs = typeof opts.timeoutMs === 'number' ? opts.timeoutMs : 20000;
      var lockButtons = opts.lockButtons !== false;

      if (lockButtons) toggleButtonLock(true);

      var settled = false;
      var timeoutId = setTimeout(function () {
        if (settled) return;
        settled = true;
        if (lockButtons) toggleButtonLock(false);
        try {
          handleError(new Error(methodName + ' timed out after ' + timeoutMs + 'ms.'), opts);
        } finally {
          finalizeRun(opts);
        }
      }, timeoutMs);

      var runner = google.script.run
        .withSuccessHandler(function (result) {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          if (lockButtons) toggleButtonLock(false);
          try {
            var payload = opts.unwrap === false ? result : unwrap(result);
            if (typeof opts.onSuccess === 'function') {
              opts.onSuccess(payload, result);
            }
          } catch (err) {
            handleError(err, opts);
          } finally {
            finalizeRun(opts);
          }
        })
        .withFailureHandler(function (err) {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          if (lockButtons) toggleButtonLock(false);
          try {
            handleError(err, opts);
          } finally {
            finalizeRun(opts);
          }
        });

      runner[methodName].apply(runner, args || []);
    }

    function confirmAndRun(checkMethod, checkArgs, runMethod, runArgs, options) {
        var opts = options || {};
        toggleLoading(true, opts.checkText || 'Validating...');
        
        run(checkMethod, checkArgs, {
            context: opts.checkContext || 'Validation',
            onSuccess: function(checkResult) {
                var itemsToConfirm = Array.isArray(checkResult) ? checkResult : [];
                
                var startExecution = function() {
                    toggleLoading(true, opts.runText || 'Processing...');
                    run(runMethod, runArgs, {
                        context: opts.runContext || 'Execution',
                        onSuccess: function(res) {
                            toggleLoading(false);
                            if (typeof opts.onSuccess === 'function') opts.onSuccess(res);
                            else if (res && res.message) showToast(res.message);
                        },
                        onError: function(err) {
                            toggleLoading(false);
                            if (typeof opts.onError === 'function') opts.onError(err);
                        }
                    });
                };

                if (itemsToConfirm.length > 0) {
                    toggleLoading(false);
                    var msg = (opts.confirmPrefix || "The following items will be created:\n\n") +
                              itemsToConfirm.join('\n') +
                              (opts.confirmSuffix || "\n\nDo you want to proceed?");
                    
                    showConfirmDialog(msg, startExecution);
                } else {
                    startExecution();
                }
            },
            onError: function(err) {
                toggleLoading(false);
                if (typeof opts.onError === 'function') opts.onError(err);
            }
        });
    }

    function initSidebar(options) {
      var opts = options || {};
      
      var helpContainer = document.getElementById('sync-sidebar-help-container');
      if (helpContainer && opts.toolKey) {
        run('UI_getHelpItems', [opts.toolKey], {
          lockButtons: false,
          unwrap: true,
          toast: false,
          onSuccess: function(res) {
            if (res && res.success && res.data) {
              _renderHelpGuide(helpContainer, res.data);
              if (opts.createIcons !== false && typeof lucide !== 'undefined' && lucide && typeof lucide.createIcons === 'function') {
                try {
                  lucide.createIcons();
                } catch (e) {}
              }
            }
          }
        });
      }

      if (opts.createIcons !== false && typeof lucide !== 'undefined' && lucide && typeof lucide.createIcons === 'function') {
        try {
          lucide.createIcons();
        } catch (e) {
          // Ignore icon hydration failures
        }
      }
      if (typeof opts.onLoad === 'function') {
        opts.onLoad();
      }
    }

    function refreshIcons() {
      if (typeof lucide !== 'undefined' && lucide && typeof lucide.createIcons === 'function') {
        try {
          lucide.createIcons();
        } catch (e) {
          // Ignore icon hydration failures
        }
      }
    }


    function runAction(options) {
      var opts = options || {};
      if (typeof opts.beforeRun === 'function') {
        var beforeResult = opts.beforeRun();
        if (beforeResult === false) return;
      }

      if (opts.loadingText) {
        toggleLoading(true, opts.loadingText, opts.loadingOptions);
      }

      if (opts.toolKey) {
        startProgressPolling(opts.toolKey);
      }

      run(opts.method, opts.args || [], {
        context: opts.context,
        unwrap: opts.unwrap,
        toast: opts.toast,
        severity: opts.severity,
        lockButtons: opts.lockButtons,
        timeoutMs: opts.timeoutMs,
        onSuccess: function (res, raw) {
          if (opts.toolKey) stopProgressPolling(opts.toolKey);
          if (opts.loadingText) toggleLoading(false, null, opts.loadingOptions);
          if (opts.statusTarget && typeof opts.setStatus !== 'function') {
            setStatusBadge(opts.statusTarget, 'ready', opts.statusOptions);
          }
          if (opts.showSuccessToast !== false) {
            var successMessage = opts.successMessage || (res && res.message);
            if (successMessage) showToast(successMessage, false, opts.toastOptions);
          }
          if (typeof opts.onSuccess === 'function') opts.onSuccess(res, raw);
        },
        onError: function (err) {
          if (opts.toolKey) stopProgressPolling(opts.toolKey);
          if (opts.loadingText) toggleLoading(false, null, opts.loadingOptions);
          if (typeof opts.onError === 'function') {
            opts.onError(err);
            return;
          }
          handleError(err, {
            context: opts.context,
            severity: opts.severity,
            toast: opts.toast,
            resetLoading: false
          });
        },
        onFinally: function() {
          if (opts.toolKey) stopProgressPolling(opts.toolKey);
          if (typeof opts.onFinally === 'function') {
            opts.onFinally();
          }
        }
      });
    }

    function runPullAction(options) {
      var opts = options || {};
      var execute = function () {
        runAction(opts.action);
      };

      if (!opts.unsavedCheckMethod) {
        execute();
        return;
      }

      confirmIfUnsaved(opts.unsavedCheckMethod, opts.unsavedCheckArgs || [], execute, {
        context: opts.unsavedContext || 'Check Changes',
        confirmMessage: opts.confirmMessage || DEFAULT_UNSAVED_MESSAGE,
        title: opts.confirmTitle || 'Unsaved Changes',
        confirmText: opts.confirmText || 'Proceed',
        cancelText: opts.cancelText || 'Cancel',
        onError: opts.onError
      });
    }

    function runPushAction(options) {
      var opts = options || {};
      if (opts.checkMethod) {
        confirmAndRun(opts.checkMethod, opts.checkArgs || [], opts.runMethod, opts.runArgs || [], opts.confirmOptions || {});
        return;
      }
      runAction(opts.action);
    }

    _initUI();
    installGlobalErrorHandlers();

    return {
      initSidebar: initSidebar,
      refreshIcons: refreshIcons,
      runAction: runAction,

      runPullAction: runPullAction,
      runPushAction: runPushAction,
      run: run,
      confirmAndRun: confirmAndRun,
      confirmIfUnsaved: confirmIfUnsaved,
      showConfirmDialog: showConfirmDialog,
      unwrap: unwrap,
      handleError: handleError,
      showToast: showToast,
      toggleLoading: toggleLoading,
      setStatusBadge: setStatusBadge,
      updateQuotaDisplay: updateQuotaDisplay,
      markQuotaError: markQuotaError
    };
  })();
</script>
