  <!-- Main Content -->
  <div class="container">

    <!-- Import Tasks -->
    <div>
      <div class="section-label">

  <?!= _App_include('SidebarShared'); ?>
  <script>
    window.onload = function () {
      SyncSidebar.initSidebar({
        toolKey: 'TASKS_SYNC',
        createIcons: true
      });
    };

    function runPull() {
      SyncSidebar.runPullAction({
        unsavedCheckMethod: 'TasksSync_checkForUnsavedChanges',
        action: {
          method: 'TasksSync_pullTasks',
          args: [],
          context: 'Pull Tasks',
          loadingText: 'Importing Tasks…'
        }
      });
    }

    function runPush() {
      SyncSidebar.runPushAction({
        action: {
          method: 'TasksSync_pushChanges',
          context: 'Push Changes',
          loadingText: 'Syncing…'
        }
      });
    }
  </script>
